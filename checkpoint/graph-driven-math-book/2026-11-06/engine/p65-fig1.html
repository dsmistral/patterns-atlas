<figcaption><strong>Fig P65.1.</strong> The Morse complex of \(h = \cos 2\pi x + \cos 2\pi y\) on the universal cover, centered at the maximum (red, center): eight descending flow lines \u2014 blue from the maximum to the four saddles (red, edge midpoints), orange from the saddles to the minima (grey, corners) \u2014 each connection drawn twice, as a mirror pair. Both lines of every pair land bit-exactly, and their signs cancel: \(+1 - 1 = 0\), the shadow of \(\partial^2 = 0\).</figcaption>
