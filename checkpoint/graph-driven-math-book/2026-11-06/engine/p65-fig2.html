<figcaption><strong>Fig P65.2.</strong> The transversality wall at \(\delta = 0\), \(\varepsilon = 0.3\): the drift \(-2\pi\varepsilon\cos 2\pi x\) per unit time (top, full scale, zero line dashed) crosses zero exactly at \(x = \tfrac14\) and \(x = \tfrac34\) \u2014 and there the time-1 map stops moving entirely: two whole circles of fixed points (red, 37 samples each), \(\det = 0\) bit-exactly at every sample because the displacement's \(x\)-row is identically zero, while every point off the circles moves by at least \(0.123\).</figcaption>
